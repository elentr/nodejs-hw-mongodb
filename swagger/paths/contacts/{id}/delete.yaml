tags:
  - Contacts
summary: Delete Contact
operationId: deleteContact
description:
  Deletes a contact by user ID. Requires authorization via Bearer token.
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    description: Contact ID to delete
    schema:
      type: string
responses:
  '204':
    description: Contact successfully deleted (no response body)
  '404':
    $ref: '../../../components/responses/404.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'
