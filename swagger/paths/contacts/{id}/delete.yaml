tags:
  - Contacts
summary: Delete Contact
operationId: deleteContact
description:
  Deletes a contact by user ID. Requires authorization via Bearer token.
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    description: Contact ID to delete
    schema:
      type: string
responses:
  '204':
    description: Contact successfully deleted (no response body)
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          $ref: ../../../components/responses/400.yaml
