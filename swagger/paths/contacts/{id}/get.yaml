tags:
  - Contacts
summary: Get a contact by its ID
operationId: getContactById
description:
  Returns detailed information about the contact by the identifier specified in
  the path. Requires authorization via Bearer token.
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    description: Contact ID to receive
    schema:
      type: string
responses:
  '200':
    description: Contact successfully found
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contact with id {id}!
            data:
              $ref: ../../../components/schemas/contact.yaml
  '404':
    $ref: '../../../components/responses/404.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'
